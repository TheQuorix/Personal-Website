services:
  backend:
    build:
      context: ./backend
    image: the-quorix-backend:1.0
    container_name: the-quorix-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - db-data:/var/lib/the-quorix/data

  frontend:
    build:
      context: ./frontend
    image: the-quorix-frontend:1.0
    container_name: the-quorix-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db-data: